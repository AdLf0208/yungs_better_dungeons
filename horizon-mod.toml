id = "betterdungeons"
name = "YUNG's Better Dungeons"
version = "0.2.0"
description = """YUNG's Better Dungeons for Horizon, slice 1: the small dungeon. The port
registers its own structure type (betterdungeons:small_dungeon_type), which assembles the
jar's carried jigsaw templates -- sixteen .nbt shells and loot piles, two template pools with
their weights and max_counts, four processor chains -- rotates and places them by the jar's
own rules, and decorates them with the eleven betterdungeons:* processors the data calls,
including the dungeon banners, the mob spawner, the chest and banner caps, the ceiling props,
the support legs and the rule processor that turns air into cave air. The other five
structures, the aggregate structure and the two biome-modifier files are recorded gaps in
notes.md."""
authors = ["YUNGNICKYOUNG", "Acarii", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side: an integrated server belongs to the client installation.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"); this port adds none, it registers a structure type and carries the jar's content.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
